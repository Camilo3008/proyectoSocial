# Despliegue de AgroPrecios en un servidor (VPS) con Docker.
# Despliegue automático desde GitHub a Google Cloud: docs/DESPLIEGUE-GCP.md.
# Uso manual en un servidor con el código (ver docs/DESPLIEGUE.md):
#   cp .env.prod.example .env.prod   # y completar con valores REALES (nunca subirlo)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api npm run migration:run:prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api npm run seed:prod
name: agroprecios-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Definir DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Definir DB_NAME}
      TZ: America/Bogota
      PGTZ: America/Bogota
    # Sin puertos publicados: solo la API llega a la base de datos (red interna).
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Nombre fijo: en el servidor (Google Cloud) la imagen llega ya construida
    # desde GitHub Actions y no se compila allí (ver docs/DESPLIEGUE-GCP.md).
    image: agroprecios-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      # Caddy está delante: la IP real del cliente viene en X-Forwarded-For.
      TRUST_PROXY: 1
    depends_on:
      db:
        condition: service_healthy

  web:
    image: agroprecios-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      # Obligatorio: Caddy no arranca con el correo vacío y Let's Encrypt lo usa para avisos.
      ACME_EMAIL: ${ACME_EMAIL:?Definir ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Respaldo diario de la base de datos (pg_dump comprimido, conserva N días).
  respaldo:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      DIAS_RETENCION: ${RESPALDO_DIAS_RETENCION:-14}
      TZ: America/Bogota
    volumes:
      - ./respaldos:/respaldos
      - ./docker/respaldo/respaldar.sh:/respaldar.sh:ro
    entrypoint: ['/bin/sh', '/respaldar.sh']
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
