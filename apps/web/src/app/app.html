<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <a class="marca" routerLink="/" aria-label="AgroPrecios, ir a Hoy">
    <svg class="marca__icono" viewBox="0 0 24 24" aria-hidden="true">
      <rect width="24" height="24" rx="5" fill="currentColor" />
      <ellipse cx="12" cy="12" rx="4.2" ry="8.4" transform="rotate(45 12 12)" fill="#fff" />
      <line x1="9" y1="9" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.1" />
    </svg>
    <span>AgroPrecios</span>
  </a>
</header>

@if (!conexion.enLinea()) {
  <div class="aviso-offline" role="status">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="aviso-offline__icono">
      <path
        d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 4-2.3M19 12.9a10 10 0 0 0-2.2-1.6M1.4 9a16 16 0 0 1 4.3-2.7M22.6 9A16 16 0 0 0 11 4.6M12 20h.01"
      />
    </svg>
    <span>Sin conexión · mostrando los últimos datos guardados</span>
  </div>
}

<main id="contenido" class="contenido" tabindex="-1">
  <router-outlet />
</main>

<nav class="barra-inferior" aria-label="Navegación principal">
  <ul>
    @for (pestana of pestanas; track pestana.ruta) {
      <li>
        <a
          [routerLink]="pestana.ruta"
          routerLinkActive="activa"
          [routerLinkActiveOptions]="{ exact: pestana.exacta }"
          ariaCurrentWhenActive="page"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            @switch (pestana.icono) {
              @case ('hoy') {
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              }
              @case ('historico') {
                <path d="M3 3v18h18" />
                <path d="M7 15l4-4 3 3 5-6" />
              }
              @case ('mundo') {
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
              }
              @case ('fuentes') {
                <circle cx="12" cy="12" r="9" />
                <path d="M12 11v6M12 7.5h.01" />
              }
            }
          </svg>
          <span>{{ pestana.etiqueta }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
