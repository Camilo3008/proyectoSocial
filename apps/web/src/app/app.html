<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="encabezado">
  <div class="encabezado__interior">
    <a class="marca" routerLink="/" aria-label="AgroPrecios, ir a Hoy">
      <svg class="marca__logo" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="#fbf3e4" />
        <path d="M27 6c9 1 15 8 14 18-9 0-15-7-14-18z" fill="#4c9a52" />
        <path
          d="M29 9c3 5 7 9 11 13"
          stroke="#2f6b3a"
          stroke-width="1.5"
          fill="none"
          stroke-linecap="round"
        />
        <ellipse cx="20" cy="28" rx="10" ry="13.5" transform="rotate(-28 20 28)" fill="#6b3f24" />
        <path
          d="M14 18.5c6 4 1 12 10 19.5"
          stroke="#fbf3e4"
          stroke-width="2.2"
          fill="none"
          stroke-linecap="round"
        />
      </svg>
      <span class="marca__texto">
        <span class="marca__nombre">AgroPrecios</span>
        <span class="marca__lema">Precios del campo · Pitalito, Huila</span>
      </span>
    </a>
  </div>
</header>

@if (avisoDatos(); as aviso) {
  <div class="aviso-offline" role="status">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="aviso-offline__icono">
      <path
        d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 4-2.3M19 12.9a10 10 0 0 0-2.2-1.6M1.4 9a16 16 0 0 1 4.3-2.7M22.6 9A16 16 0 0 0 11 4.6M12 20h.01"
      />
    </svg>
    <span>{{ aviso }}</span>
  </div>
}

@if (actualizacion.disponible()) {
  <div class="aviso-version" role="status">
    <span>Hay una nueva versión de AgroPrecios.</span>
    <button type="button" class="boton" (click)="actualizacion.actualizar()">
      Toca para actualizar
    </button>
  </div>
}

<main id="contenido" class="contenido" tabindex="-1">
  <router-outlet />
</main>

<nav class="barra-inferior" aria-label="Navegación principal">
  <ul>
    @for (pestana of pestanas; track pestana.ruta) {
      <li>
        <a
          [routerLink]="pestana.ruta"
          routerLinkActive="activa"
          [routerLinkActiveOptions]="{ exact: pestana.exacta }"
          ariaCurrentWhenActive="page"
        >
          <span class="barra-inferior__icono">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @switch (pestana.icono) {
                @case ('hoy') {
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                  />
                }
                @case ('historico') {
                  <path d="M3 3v18h18" />
                  <path d="M7 15l4-4 3 3 5-6" />
                }
                @case ('mundo') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
                }
                @case ('fuentes') {
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 11v6M12 7.5h.01" />
                }
              }
            </svg>
          </span>
          <span>{{ pestana.etiqueta }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
